kind = "web"
previewPath = "/"
title = "GoodMatter"
version = "1.0.0"
id = "artifacts/goodmatter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19192

[services.development]
run = "pnpm --filter @workspace/goodmatter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/goodmatter", "run", "build" ]
publicDir = "artifacts/goodmatter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19192"
BASE_PATH = "/"
